# ╔═════════════════════════════════════════════════════════════════════════════╗
# ║              ModernSlimefunPet — pet pack (the 'pets:' block)                ║
# ╚═════════════════════════════════════════════════════════════════════════════╝
#  21 pets in 7 lines of 3. This file is the 'pets:' section ONLY: paste it over the
#  'pets:' block at the bottom of plugins/ModernSlimefunPet/pets.yml (or
#  src/main/resources/pets.yml). Everything above it — food, the stat pool, the pet
#  items, the menu texts, the messages — stays exactly as it is.
#
#  A line that ends its chain (magma_beast, aurum_dragon, ...) has no 'evolution:'
#  block, which is what makes it the end. Every 'into' points at a pet defined here.
#
#  No artwork is shipped: 'model: none' keeps the head. Give a pet a look by dropping
#  models/<pet id>.bbmodel in and setting 'model: <pet id>', or by filling 'skull:'.
#  Reload with: /slimefunpet reload
#
#  Money costs (money-cost) need Vault plus an economy plugin, otherwise the
#  evolution is refused rather than run for free.

