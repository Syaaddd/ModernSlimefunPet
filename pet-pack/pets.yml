# ╔══════════════════════════════════════════════════════════╗
# ║                       Pets                               ║
# ╚══════════════════════════════════════════════════════════╝
#  max-level:             highest level this pet can reach
#  level-cost:            exp needed to go from {level} to the next one. This
#                         is a formula, so the levels can be made to cost more
#                         as the pet climbs:
#                           1500                          every level costs the same
#                           1500 * 1.15 ^ ({level} - 1)   +15% per level
#                           1500 * {level}                1500, 3000, 4500, ...
#                           1500 + ({level} ^ 2 * 50)     slow start, steep end
#  food-decay-multiplier: 2.0 makes this pet get hungry twice as fast
#  exp-per-food:          the exp this pet earns per 1 food it burns. Also
#                         takes {level} as a formula. Remove the key to follow
#                         the global 'food.exp-per-food'.
#                         This is a flat amount, so raising 'level-cost' is
#                         what makes the higher levels take longer
#  starting-stats:        how many random stats it rolls when obtained
#  max-stats:             how many stats this pet can hold at once. Remove the
#                         key to follow the global 'stats.max-stats'.
#                         This is a hard ceiling: the starting stats, the extra
#                         ones an evolution rolls and every reroll item all
#                         stop here, so a pet with 3 ends up with 3 or less
#  stat-pool:             which stats out of 'stats.pool' this pet is allowed
#                         to roll. Remove the key to let it roll anything.
#                         As a list every stat keeps its global weight:
#                           stat-pool:
#                             - max_health
#                             - haste
#                         As a section each one can be made rarer or more
#                         common for this pet alone, the number being the
#                         weight against the others in the same pool:
#                           stat-pool:
#                             max_health: 40
#                             haste: 5
#                         This decides the starting stats, the extra stats an
#                         evolution rolls and what a reroll can land on. Stats
#                         a pet already owns are kept even if a later evolution
#                         no longer lists them
#  guaranteed-stats:      stats every pet of this id always has, at the exact
#                         value given (its level 1 value, scaled by level like
#                         a rolled one). They sit on top of the rolled stats:
#                         not counted in 'max-stats', never rerolled, burned or
#                         lockable, and a reroll can still roll the same stat
#                         again as a normal one, both then count.
#                         Read from here, not saved on the pet, so editing it
#                         changes every existing pet, and an evolved pet gets
#                         the guaranteed stats of what it became.
#                           guaranteed-stats:
#                             armor: 1
#                             luck: 1
#  evolution:             what it turns into, remove it to end the chain
#    into:                the pet id it becomes
#    required-level:      the level it has to reach first
#    item:                the id of the evolution item it needs. Can also be a
#                         list, so several stones open the same evolution.
#                         Leave it out to take any evolution item
#    chance:              base success rate in percent. A stone with a
#                         'chance-bonus' adds to this, capped at 100
#    bonus-stats:         extra stats rolled on a successful evolution, never
#                         taking the pet past the 'max-stats' it becomes
#    keep-level:          keep the level instead of resetting it to 1
#    lose-item-on-fail:   consume the item even when the evolution fails
#    money-cost:          money taken for the attempt, on top of whatever the
#                         stone itself costs. 0 to disable
#    item-requirement:    an item the player has to hand over
#                         (material/material-name, display-name, amount). Use 'item-requirements' with a key per entry
#                         to ask for several different items
#
#    Everything above is shown to the player, marked met or unmet, through the
#    '{requirements}' line of 'gui-modes.evolution.pet-lore'.
#    The money and the items are taken when the attempt is made, win or lose,
#    the same way the money cost of the stone already was.
#
#    evolution:
#      into: uncommon_speed_pet
#      required-level: 21
#      item:
#        - evolution_stone
#        - blessed_evolution_stone
#      chance: 75.0
#      money-cost: 250000
#      item-requirement:
#        material-name: DIAMOND
#        display-name: '&bPure Diamond'
#        amount: 16
#      item-requirements:
#        shards:
#          material-name: PRISMARINE_SHARD
#          display-name: '&bPet Shard'
#          amount: 32
#        essence:
#          material-name: GHAST_TEAR
#          display-name: '&fBeast Essence'
#          amount: 4
# --------------------------------------------------------------------------
# A sample chain to start from: common -> rare -> epic. Rename, add or remove
# pets freely; every key is explained above.
pets:

  # ═══ Line A — Ember: the combat line ═══

  # A cheap starter that only knows how to bite.
  ember_pup:
    max-level: 10
    level-cost: '1000 * 1.15 ^ ({level} - 1)'
    food-decay-multiplier: 1.0
    exp-per-food: '30'
    starting-stats: 3
    max-stats: 8
    # No artwork shipped: 'model: none' keeps the head. Drop
    # models/ember_pup.bbmodel in and set 'model: ember_pup' (or fill
    # 'skull:' with your own head texture) to give it a look.
    model: none
    stat-pool:
      attack_damage: 30
      max_health: 25
      armor: 20
      movement_speed: 15
      haste: 10
    guaranteed-stats:
      attack_damage: 0.5
    item-display-name: "&f&l[I] &7Ember Pup"
    item-lore:
      - "&8Pet Item"
      - "&7"
      - "&7Equip this pet to gain its stats."
      - "&7"
      - "&9&lProgress"
      - " &b┠ &7Level: &f{level} &8/ &f{max_level}"
      - " &b┠ &7EXP: &a{exp} &8/ &c{exp_needed}"
      - "  {progress_bar}"
      - "&7"
      - "&6&lFood"
      - "  {food_bar} &7{food_percent}%"
      - " &e┣ &7Status: {status}"
      - "&7"
      - "&d&lStats &7(&f{stat_scaling}%&7)"
      - "{stats}"
      - "&7"
      - " &b┣ &7Evolves into: &f{evolution}"
      - "&7"
      - "&7&o(( &f&oLeft-Click &7&oto &amanage &7&othis pet! ))"
    evolution:
      into: ash_hound
      display-name: "&9&l[II] &9Ash Hound"
      required-level: 10
      item:
        - evolution_stone
        - blessed_evolution_stone
      chance: 50.0
      bonus-stats: 1
      keep-level: false
      lose-item-on-fail: true
      money-cost: 50000

  # Faster and hungrier than the pup.
  ash_hound:
    max-level: 15
    level-cost: '2500 * 1.15 ^ ({level} - 1)'
    food-decay-multiplier: 1.5
    exp-per-food: '30'
    starting-stats: 3
    max-stats: 8
    # No artwork shipped: 'model: none' keeps the head. Drop
