# Pet Item Store, ꜱᴛᴀᴛꜱ - DeluxeMenus menu (Alwination house style, Arcane theme)
#
# Slots used:
#   12  Evolution Stone
#   14  Blessed Evolution Stone
#   19  Stat Reroll Token
#   21  Blessed Stat Reroll Token
#   23  Stat Shard
#   25  Stat Eraser
#   31  Stat Lock Charm
#   39  Auto-Feed Unlocker
#   41  Auto-Feed Upgrade
#   45   previous page      49  balance info      53  next page
#   0-53 filler (GRAY_STAINED_GLASS_PANE)
#
# Placeholders: %player_name% (click commands), %nextcredits_balance% (PAPI / NextCredits)
# Evolve a pet, reroll, erase or lock its stats, and let it feed itself.

menu_title: '&8&nᴘᴇᴛ ꜱᴛᴀᴛꜱ'
size: 54

items:

  'filler':
    material: GRAY_STAINED_GLASS_PANE
    display_name: ' '
    slots:
    - 0-53

  'evolution_stone':
    material: AMETHYST_CLUSTER
    slot: 12
    item_flags: [HIDE_ATTRIBUTES]
    display_name: '&#31BCFF&lEvolution Stone'
    lore:
    - '&8Evolution Item'
    - ''
    - '&7Use it on a max level pet to evolve it into'
    - '&7the next pet of its chain. A failed try burns.'
    - ''
    - ' &8◊ &7Contents: &f1x Evolution Stone'
    - ' &8◊ &7Result: &fEvolution &7or nothing'
    - ' &8◊ &7Price: &#FFD27A⚜ 750 &fCr'
    - ' &8◊ &7Your Credits: &f%nextcredits_balance%'
    - ''
    - '&#83ca16→ &#70e510Click to Buy'
    click_requirement:
      deny_commands:
      - '[message] &#d92625&l! &7You need &#FFD27A⚜ 750 &7Credits for this.'
      - '[close]'
      requirements:
        credits:
          type: javascript
          expression: '%nextcredits_balance% >= 750'
    click_commands:
    - '[message] &#8FF384&l! &7Purchased &#D6A8FF1x Evolution Stone&7.'
    - '[console] nextcredits take %player_name% 750'
    - '[console] slimefunpet givepetitem %player_name% evolution evolution_stone 1'
    - '[sound] ENTITY_PLAYER_LEVELUP'
    - '[close]'

