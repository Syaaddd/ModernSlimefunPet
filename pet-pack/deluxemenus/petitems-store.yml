# Pet Item Store, ᴄᴀʀᴇ - DeluxeMenus menu (Alwination house style, Arcane theme)
#
# Slots used:
#   13  Common Pet (starter pet)
#   19  Pet Treat
#   21  Pet Feast
#   23  Pet Candy
#   25  Super Pet Candy
#   31  Pet Revival Totem
#   45   previous page      49  balance info      53  next page
#   0-53 filler (GRAY_STAINED_GLASS_PANE)
#
# Placeholders: %player_name% (click commands), %nextcredits_balance% (PAPI / NextCredits)
# The starter pet plus everything it eats, drinks or needs to come back.

menu_title: '&8&nᴘᴇᴛ ᴄᴀʀᴇ'
open_command: petstore
register_command: true
size: 54

items:

  'filler':
    material: GRAY_STAINED_GLASS_PANE
    display_name: ' '
    slots:
    - 0-53

  'common_pet':
    material: 'texture-c31e7e1c614639bbc95a0d81ff7e5f7f606d9b33115cf2bf2a40cdcbbb531324'
    slot: 13
    item_flags: [HIDE_ATTRIBUTES]
    display_name: '&e&l[I] &#62FF8C&lCommon Pet'
    lore:
    - '&8Pet'
    - ''
    - '&7A starter pet: feed it to level it up, then'
    - '&7evolve it into a &9&lRare Pet &7at level &f10&7.'
    - ''
    - ' &8◊ &7Level: &f1 &8/ &f10'
    - ' &8◊ &7Starts with: &f3 stats &7(up to &f8&7)'
    - ' &8◊ &7Food: &f+30 EXP &7per feed'
    - ' &8◊ &7Evolves into: &9&lRare Pet'
    - ' &8◊ &7Price: &#FFD27A⚜ 1,500 &fCr'
    - ' &8◊ &7Your Credits: &f%nextcredits_balance%'
    - ''
    - '&#83ca16→ &#70e510Click to Buy'
    click_requirement:
      deny_commands:
      - '[message] &#d92625&l! &7You need &#FFD27A⚜ 1,500 &7Credits for this.'
      - '[close]'
      requirements:
        credits:
          type: javascript
          expression: '%nextcredits_balance% >= 1500'
    click_commands:
    - '[message] &#8FF384&l! &7Purchased &#D6A8FF1x Common Pet&7.'
    - '[console] nextcredits take %player_name% 1500'
    - '[console] slimefunpet givepet %player_name% common_pet 1'
    - '[sound] ENTITY_PLAYER_LEVELUP'
    - '[close]'

