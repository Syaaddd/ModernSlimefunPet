# Pet Item Store, ᴄᴀʀᴇ - DeluxeMenus menu (Alwination house style, Arcane theme)
#
# Slots used:
#   12  Pet Treat
#   14  Pet Feast
#   21  Pet Candy
#   23  Super Pet Candy
#   30  Auto-Feed Unlocker
#   32  Auto-Feed Upgrade
#   40  Pet Revival Totem
#   45   previous page      49  balance info      53  next page
#   0-53 filler (GRAY_STAINED_GLASS_PANE)
#
# Placeholders: %player_name% (click commands), %nextcredits_balance% (PAPI / NextCredits)
# Food, Candy, Auto-Feed and Revival items - everything a pet eats or needs.

menu_title: '&8&nᴘᴇᴛ ᴄᴀʀᴇ'
open_command: petstore
register_command: true
size: 54

items:

  'filler':
    material: GRAY_STAINED_GLASS_PANE
    display_name: ' '
    slots:
    - 0-53

  'pet_treat':
    material: COOKIE
    slot: 12
    item_flags: [HIDE_ATTRIBUTES]
    display_name: '&#CB883E&lPet Treat &8x10'
    lore:
    - '&8Food Item'
    - ''
    - '&7Feed this to one of your pets to top up its'
    - '&7Hunger, or drop it in the pet''s Auto-Feed slot.'
    - ''
    - ' &8◊ &7Contents: &f10x Pet Treat'
    - ' &8◊ &7Restores: &f+25 &7Food each'
    - ' &8◊ &7Price: &#FFD27A⚜ 500 &fCr'
    - ' &8◊ &7Your Credits: &f%nextcredits_balance%'
    - ''
    - '&#83ca16→ &#70e510Click to Buy'
    click_requirement:
      deny_commands:
      - '[message] &#d92625&l! &7You need &#FFD27A⚜ 500 &7Credits for this.'
      - '[close]'
      requirements:
        credits:
          type: javascript
          expression: '%nextcredits_balance% >= 500'
    click_commands:
    - '[message] &#8FF384&l! &7Purchased &#D6A8FF10x Pet Treat&7.'
    - '[console] nextcredits take %player_name% 500'
    - '[console] slimefunpet givepetitem %player_name% food small_treat 10'
    - '[sound] ENTITY_PLAYER_LEVELUP'
    - '[close]'

  'pet_feast':
    material: PUMPKIN_PIE
    slot: 14
    item_flags: [HIDE_ATTRIBUTES]
    display_name: '&#FFF5A3&lPet Feast &8x5'
    lore:
    - '&8Food Item'
    - ''
    - '&7A full meal for one pet. Best saved for the'
    - '&7pets that drain Hunger the fastest.'
    - ''
    - ' &8◊ &7Contents: &f5x Pet Feast'
    - ' &8◊ &7Restores: &f+150 &7Food each'
    - ' &8◊ &7Price: &#FFD27A⚜ 1,100 &fCr'
    - ' &8◊ &7Your Credits: &f%nextcredits_balance%'
